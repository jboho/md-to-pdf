appId: com.md-to-pdf.app
productName: MD to PDF
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/icon.png
asarUnpack:
  - node_modules/better-sqlite3/**
# electron-updater reads Contents/Resources/app-update.yml to find the release
# feed. electron-builder writes that file on macOS only for dmg/zip targets, and
# we build with `dir` (see mac.target), so it is committed and copied in here.
# test/app-update-config.test.ts keeps it in step with the publish block below.
# scripts/make-dmg.js writes the matching latest-mac.yml release manifest.
extraResources:
  - from: resources/app-update.yml
    to: app-update.yml
publish:
  provider: github
  owner: jboho
  repo: md-to-pdf
afterSign: scripts/notarize.js
# Close the ways a signed build can be made to run code other than the
# packaged app: ELECTRON_RUN_AS_NODE, NODE_OPTIONS, --inspect, a loose app/
# folder next to app.asar, and a modified app.asar. grantFileProtocolExtraPrivileges
# stays on because the renderer and PDF pages load over file://.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
mac:
  icon: resources/icon.icns
  category: public.app-category.productivity
  # Electron 44 dropped macOS 12; say so in Info.plist so Finder refuses to
  # launch it on older systems instead of crashing.
  minimumSystemVersion: "13.0"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Notarization runs via the afterSign hook (scripts/notarize.js), gated on
  # Apple credentials, so keep electron-builder's built-in notarize disabled.
  notarize: false
  # Build only the signed + notarized .app here (target overridden to `dir` on
  # the CLI). The .dmg is assembled from a clean copy by scripts/make-dmg.js,
  # because electron-builder's inline hdiutil DMG step fails with "Resource
  # busy" against the live app bundle on this toolchain.
  target:
    - dir
