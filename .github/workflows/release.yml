name: Release

# Build & publish a macOS DMG to a GitHub Release on a version tag.
# Bump package.json "version", commit it, then:
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# Signing secrets come from the `release` environment (see README.md
# "Publishing a release"). The "Verify" step fails the build unless the app is
# Developer ID signed, notarized and fused, so a misconfigured secret can't
# silently ship a DMG that Gatekeeper blocks.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    # The Apple signing secrets live in this environment, and only v* tags
    # may deploy to it, so a workflow run from any branch cannot read them.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: command npm ci

      # electron-builder's own CSC_LINK keychain import is broken on current
      # macOS runners: it creates a temp keychain with a random password, then
      # runs `security set-key-partition-list -k $CSC_KEY_PASSWORD` — passing
      # the *cert* password where the *keychain* password is required, which
      # fails with "SecKeychainUnlock: passphrase you entered is not correct".
      # So we import the cert into a keychain we control here and let
      # electron-builder discover the identity from the search list instead
      # (CSC_LINK/CSC_KEY_PASSWORD intentionally NOT passed to `npm run dist`).
      - name: Import Developer ID certificate into a signing keychain
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12_BASE64}" ] || [ -z "${CERT_PASSWORD}" ]; then
            echo "::error::APPLE_CERTIFICATE_P12_BASE64 / APPLE_CERTIFICATE_PASSWORD are not set."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/devid.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # -lut keeps the keychain unlocked through the multi-minute notarize.
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$CERT_PASSWORD" \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/productbuild
          # -k here is the KEYCHAIN password (the fix vs. electron-builder's bug).
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # Put our keychain first on the user search list so electron-builder's
          # identity auto-discovery finds the Developer ID cert.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)

          rm -f "$CERT_PATH"
          echo "Imported signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build, sign, notarize, package DMG
        env:
          # No CSC_LINK/CSC_KEY_PASSWORD: electron-builder signs with the
          # Developer ID identity discovered from the keychain above. These
          # remain for scripts/notarize.js + scripts/make-dmg.js.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: command npm run dist

      # Hard gate: electron-builder falls back to an ad-hoc *unsigned* build
      # (exit 0) when it can't find an identity. Fail loudly instead of
      # publishing a Gatekeeper-tripping DMG.
      - name: Verify the app is Developer ID signed
        run: |
          set -euo pipefail
          APP="$(ls -d dist/mac*/*.app | head -1)"
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -q "Authority=Developer ID Application" || {
            echo "::error::$APP is not Developer ID signed (ad-hoc/unsigned fallback)."
            exit 1
          }
          # scripts/notarize.js and make-dmg.js skip notarization when an
          # APPLE_* secret is missing, which would ship a DMG Gatekeeper blocks.
          xcrun stapler validate "$APP"
          for dmg in dist/*.dmg; do xcrun stapler validate "$dmg"; done
          # electronFuses in electron-builder.yml; an unflipped fuse leaves
          # ELECTRON_RUN_AS_NODE etc. able to run arbitrary code as this app.
          FUSES="$(npx --no-install electron-fuses read --app "$APP")"
          echo "$FUSES"
          for fuse in "RunAsNode is Disabled" \
                      "EnableNodeOptionsEnvironmentVariable is Disabled" \
                      "EnableNodeCliInspectArguments is Disabled" \
                      "OnlyLoadAppFromAsar is Enabled" \
                      "EnableEmbeddedAsarIntegrityValidation is Enabled"; do
            grep -qF "$fuse" <<<"$FUSES" || {
              echo "::error::Expected fuse state missing: $fuse"
              exit 1
            }
          done
          # Every file latest-mac.yml points at must exist and match an upload
          # glob below, or auto-update breaks for installed copies with no error
          # on this side. MacUpdater installs only from the zip.
          URLS="$(sed -n 's/^  - url: //p' dist/latest-mac.yml)"
          grep -q '\.zip$' <<<"$URLS" || {
            echo "::error::latest-mac.yml lists no .zip; MacUpdater cannot install from a dmg."
            exit 1
          }
          for f in $URLS; do
            case "$f" in
              *.dmg|*.zip) test -f "dist/$f" || { echo "::error::latest-mac.yml lists missing dist/$f"; exit 1; } ;;
              *) echo "::error::latest-mac.yml lists $f, which is not uploaded"; exit 1 ;;
            esac
          done

      - name: Publish DMG, update zip and manifest to the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
