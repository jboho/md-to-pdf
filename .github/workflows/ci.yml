name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  build-test:
    # macOS: this is a macOS desktop app, and the build should load the same
    # darwin-arm64 better-sqlite3 binary the app ships.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: command npm ci
      - run: command npm run typecheck
      - run: command npm test
      - run: command npm run build
