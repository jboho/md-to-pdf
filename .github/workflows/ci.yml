name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  build-test:
    # macOS: better-sqlite3's postinstall rebuild targets Electron's ABI, and
    # this is ultimately a macOS desktop app.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: command npm ci
      - run: command npm run typecheck
      # postinstall rebuilds better-sqlite3 for Electron's Node ABI, but
      # vitest runs under plain Node — rebuild for that ABI before testing,
      # or every DB-backed test fails with a NODE_MODULE_VERSION mismatch.
      - run: command npm run rebuild:node
      - run: command npm test
      - run: command npm run build
